<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Swing Trader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1120;
      color: #e5e7eb;
    }

    header {
      background: linear-gradient(135deg, #111827, #1e293b);
      padding: 30px 20px;
      border-bottom: 1px solid #334155;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      color: #94a3b8;
      margin-top: 8px;
      font-size: 14px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px;
    }

    .status {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      color: #94a3b8;
    }

    .stocks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 20px;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #64748b;
    }

    .symbol {
      font-size: 24px;
      font-weight: bold;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      margin: 12px 0;
    }

    .positive {
      color: #22c55e;
    }

    .negative {
      color: #ef4444;
    }

    .rating {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      background: #334155;
      margin-bottom: 15px;
    }

    .buy {
      background: #14532d;
      color: #86efac;
    }

    .watch {
      background: #78350f;
      color: #fde68a;
    }

    .hold {
      background: #1e3a8a;
      color: #93c5fd;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      color: #94a3b8;
      font-size: 14px;
    }

    .data-row span:last-child {
      color: #e5e7eb;
    }

    .reasons {
      margin-top: 15px;
      border-top: 1px solid #334155;
      padding-top: 12px;
    }

    .reasons-title {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .reason {
      font-size: 13px;
      margin: 5px 0;
      color: #cbd5e1;
    }

    footer {
      text-align: center;
      color: #64748b;
      padding: 30px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <h1>📈 AI Swing Trader</h1>
    <div class="subtitle">
      AI-powered Swing Trading Dashboard
    </div>
  </div>
</header>

<div class="container">

  <div class="status" id="status">
    データを読み込み中...
  </div>

  <div class="stocks" id="stocks">
  </div>

</div>

<footer>
  AI Swing Trader | GitHub Actions Auto Update
</footer>

<script>

async function loadData() {

  try {

    const response = await fetch("data.json?" + new Date().getTime());

    const data = await response.json();

    document.getElementById("status").innerHTML =
      "最終更新： " + data.updated_at +
      "　｜　Market： " + data.market;

    const container = document.getElementById("stocks");

    container.innerHTML = "";

    data.stocks.forEach(stock => {

      let changeClass =
        stock.change_percent >= 0
          ? "positive"
          : "negative";

      let ratingClass =
        stock.rating.toLowerCase();

      let reasonsHTML = "";

      stock.reasons.forEach(reason => {

        reasonsHTML +=
          `<div class="reason">✓ ${reason}</div>`;

      });

      const card = `
        <div class="card">

          <div class="symbol">
            ${stock.symbol}
          </div>

          <div class="price">
            $${stock.price}
          </div>

          <div class="${changeClass}">
            ${stock.change_percent >= 0 ? "+" : ""}
            ${stock.change_percent}%
          </div>

          <br>

          <div class="rating ${ratingClass}">
            ${stock.rating}
          </div>

          <div class="data-row">
            <span>5日騰落率</span>
            <span>${stock.change_5d}%</span>
          </div>

          <div class="data-row">
            <span>MA20</span>
            <span>${stock.ma20}</span>
          </div>

          <div class="data-row">
            <span>MA50</span>
            <span>${stock.ma50}</span>
          </div>

          <div class="data-row">
            <span>RSI</span>
            <span>${stock.rsi}</span>
          </div>

          <div class="data-row">
            <span>AI Score</span>
            <span>${stock.score}</span>
          </div>

          <div class="reasons">

            <div class="reasons-title">
              判定理由
            </div>

            ${reasonsHTML}

          </div>

        </div>
      `;

      container.innerHTML += card;

    });

  }

  catch (error) {

    document.getElementById("status").innerHTML =
      "データの読み込みに失敗しました";

    console.error(error);

  }

}

loadData();

</script>

</body>
</html>
